        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
---
# Users API Service
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: library-system
spec:
  selector:
    app: users-api
  ports:
  - port: 8082
    targetPort: 8082
---
# Web UI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: library-system
  annotations:
    instana.io/monitored: "true"
  labels:
    app: web-ui
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: library-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
        app.kubernetes.io/name: web-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: library-system
      annotations:
        instana.io/monitored: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/health"
    spec:
      containers:
      - name: web-ui
        image: dikamath/library-web-ui:v1.0.2
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: BOOKS_API_URL
          value: "http://books-api:8081"
        - name: USERS_API_URL
          value: "http://users-api:8082"
        - name: INSTANA_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
# Web UI Service
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: library-system
spec:
  selector:
    app: web-ui
  ports:
  - port: 8080
    targetPort: 8080
---
# Web UI Route
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web-ui
  namespace: library-system
spec:
  to:
    kind: Service
    name: web-ui
  port:
    targetPort: 8080
---
# Load Generator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: library-system
spec:
  replicas: 0  # Start with 0, scale up when needed
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load-generator
        image: dikamath/library-load-generator:v1.0.2
        imagePullPolicy: Always
        env:
        - name: WEB_UI_URL
          value: "http://web-ui:8080"
        - name: BOOKS_API_URL
          value: "http://books-api:8081"
        - name: USERS_API_URL
          value: "http://users-api:8082"
        - name: REQUESTS_PER_MINUTE
          value: "30"
        - name: DURATION_MINUTES
          value: "0"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

